<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="800" height="400" fill="#f0f9ff"/>

  <!-- Left card: Calendar -->
  <rect x="30" y="30" width="330" height="340" rx="14" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="30" y="30" width="330" height="52" rx="14" fill="#2563eb"/>
  <rect x="30" y="68" width="330" height="14" fill="#2563eb"/>
  <text x="195" y="62" text-anchor="middle" fill="white" font-size="16" font-weight="600">Disponibilitate — Aprilie</text>

  <!-- Weekday labels -->
  <text x="75"  y="102" text-anchor="middle" fill="#94a3b8" font-size="12">L</text>
  <text x="133" y="102" text-anchor="middle" fill="#94a3b8" font-size="12">M</text>
  <text x="191" y="102" text-anchor="middle" fill="#94a3b8" font-size="12">M</text>
  <text x="249" y="102" text-anchor="middle" fill="#94a3b8" font-size="12">J</text>
  <text x="307" y="102" text-anchor="middle" fill="#94a3b8" font-size="12">V</text>

  <!-- Row 1 — occupied gray -->
  <circle cx="75"  cy="135" r="17" fill="#e2e8f0"/>
  <text x="75"  y="140" text-anchor="middle" fill="#94a3b8" font-size="13">7</text>
  <circle cx="133" cy="135" r="17" fill="#e2e8f0"/>
  <text x="133" y="140" text-anchor="middle" fill="#94a3b8" font-size="13">8</text>
  <circle cx="191" cy="135" r="17" fill="#e2e8f0"/>
  <text x="191" y="140" text-anchor="middle" fill="#94a3b8" font-size="13">9</text>
  <!-- Available green -->
  <circle cx="249" cy="135" r="17" fill="#10b981"/>
  <text x="249" y="140" text-anchor="middle" fill="white" font-size="13" font-weight="600">10</text>
  <circle cx="307" cy="135" r="17" fill="#10b981"/>
  <text x="307" y="140" text-anchor="middle" fill="white" font-size="13" font-weight="600">11</text>

  <!-- Row 2 -->
  <circle cx="75"  cy="188" r="17" fill="#10b981"/>
  <text x="75"  y="193" text-anchor="middle" fill="white" font-size="13" font-weight="600">14</text>
  <circle cx="133" cy="188" r="17" fill="#10b981"/>
  <text x="133" y="193" text-anchor="middle" fill="white" font-size="13" font-weight="600">15</text>
  <circle cx="191" cy="188" r="17" fill="#e2e8f0"/>
  <text x="191" y="193" text-anchor="middle" fill="#94a3b8" font-size="13">16</text>
  <circle cx="249" cy="188" r="17" fill="#e2e8f0"/>
  <text x="249" y="193" text-anchor="middle" fill="#94a3b8" font-size="13">17</text>
  <circle cx="307" cy="188" r="17" fill="#e2e8f0"/>
  <text x="307" y="193" text-anchor="middle" fill="#94a3b8" font-size="13">18</text>

  <!-- Row 3 -->
  <circle cx="75"  cy="241" r="17" fill="#e2e8f0"/>
  <text x="75"  y="246" text-anchor="middle" fill="#94a3b8" font-size="13">21</text>
  <circle cx="133" cy="241" r="17" fill="#10b981"/>
  <text x="133" y="246" text-anchor="middle" fill="white" font-size="13" font-weight="600">22</text>
  <circle cx="191" cy="241" r="17" fill="#10b981"/>
  <text x="191" y="246" text-anchor="middle" fill="white" font-size="13" font-weight="600">23</text>
  <circle cx="249" cy="241" r="17" fill="#e2e8f0"/>
  <text x="249" y="246" text-anchor="middle" fill="#94a3b8" font-size="13">24</text>
  <circle cx="307" cy="241" r="17" fill="#e2e8f0"/>
  <text x="307" y="246" text-anchor="middle" fill="#94a3b8" font-size="13">25</text>

  <!-- Legend -->
  <circle cx="80" cy="295" r="8" fill="#10b981"/>
  <text x="96" y="300" fill="#64748b" font-size="12">Disponibil</text>
  <circle cx="180" cy="295" r="8" fill="#e2e8f0"/>
  <text x="196" y="300" fill="#64748b" font-size="12">Ocupat</text>

  <!-- Bed icon -->
  <rect x="90" y="320" width="240" height="28" rx="6" fill="#f1f5f9"/>
  <rect x="90" y="314" width="40" height="20" rx="4" fill="#cbd5e1"/>
  <rect x="270" y="314" width="40" height="20" rx="4" fill="#cbd5e1"/>
  <text x="195" y="338" text-anchor="middle" fill="#64748b" font-size="12" font-weight="500">cameră dublă · 2 persoane</text>

  <!-- Right card: Chat -->
  <rect x="440" y="30" width="330" height="340" rx="14" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="440" y="30" width="330" height="52" rx="14" fill="#2563eb"/>
  <rect x="440" y="68" width="330" height="14" fill="#2563eb"/>
  <circle cx="468" cy="56" r="16" fill="white" opacity="0.25"/>
  <text x="492" y="61" fill="white" font-size="15" font-weight="600">MyChatbot</text>

  <!-- Bot message 1 -->
  <rect x="456" y="96" width="200" height="40" rx="10" fill="#f1f5f9"/>
  <text x="468" y="113" fill="#0f172a" font-size="13">Bună ziua! Cu ce</text>
  <text x="468" y="129" fill="#0f172a" font-size="13">vă pot ajuta?</text>

  <!-- User message -->
  <rect x="508" y="150" width="240" height="36" rx="10" fill="#2563eb"/>
  <text x="520" y="173" fill="white" font-size="13">Aveți camere în 10-11 Apr?</text>

  <!-- Bot response — green -->
  <rect x="456" y="200" width="250" height="52" rx="10" fill="#10b981"/>
  <text x="468" y="220" fill="white" font-size="14" font-weight="700">Avem disponibilă! ✓</text>
  <text x="468" y="240" fill="white" font-size="12">10–11 Aprilie · 2 persoane</text>

  <!-- Bot follow-up -->
  <rect x="456" y="266" width="260" height="36" rx="10" fill="#f1f5f9"/>
  <text x="468" y="280" fill="#0f172a" font-size="12">Doriți să facem o rezervare?</text>
  <text x="468" y="296" fill="#64748b" font-size="11">Vă rog să-mi lăsați numele și telefonul.</text>

  <!-- Input bar -->
  <rect x="456" y="318" width="290" height="30" rx="15" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="472" y="337" fill="#94a3b8" font-size="12">Scrieți un mesaj...</text>
</svg>
