<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- VS badge center -->
  <circle cx="400" cy="200" r="30" fill="#0f172a"/>
  <text x="400" y="207" text-anchor="middle" fill="white" font-size="16" font-weight="700">VS</text>

  <!-- Left card: Formular -->
  <rect x="30" y="40" width="320" height="320" rx="14" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="30" y="40" width="320" height="48" rx="14" fill="#94a3b8"/>
  <rect x="30" y="74" width="320" height="14" fill="#94a3b8"/>
  <text x="190" y="70" text-anchor="middle" fill="white" font-size="15" font-weight="600">Formular de contact</text>

  <!-- Form fields (gray rectangles) -->
  <text x="54" y="112" fill="#94a3b8" font-size="11">Nume *</text>
  <rect x="54" y="118" width="272" height="26" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="54" y="162" fill="#94a3b8" font-size="11">Prenume *</text>
  <rect x="54" y="168" width="272" height="26" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="54" y="212" fill="#94a3b8" font-size="11">Email *</text>
  <rect x="54" y="218" width="272" height="26" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="54" y="262" fill="#94a3b8" font-size="11">Telefon *</text>
  <rect x="54" y="268" width="272" height="26" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="54" y="312" fill="#94a3b8" font-size="11">Mesaj *</text>
  <rect x="54" y="318" width="272" height="26" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Red X badge -->
  <circle cx="318" cy="54" r="20" fill="#ef4444"/>
  <line x1="308" y1="44" x2="328" y2="64" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="328" y1="44" x2="308" y2="64" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Label below -->
  <text x="190" y="385" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="500">Completează. Trimite. Așteaptă.</text>

  <!-- Right card: Chat -->
  <rect x="450" y="40" width="320" height="320" rx="14" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="450" y="40" width="320" height="48" rx="14" fill="#dc2626"/>
  <rect x="450" y="74" width="320" height="14" fill="#dc2626"/>
  <text x="610" y="70" text-anchor="middle" fill="white" font-size="15" font-weight="600">Chat AI</text>

  <!-- Chat bubbles -->
  <rect x="466" y="96" width="180" height="36" rx="10" fill="#f1f5f9"/>
  <text x="478" y="119" fill="#0f172a" font-size="13">Bună! Cu ce ajut?</text>

  <rect x="526" y="146" width="220" height="36" rx="10" fill="#2563eb"/>
  <text x="538" y="169" fill="white" font-size="13">Vreau să rezerv o cameră.</text>

  <rect x="466" y="196" width="200" height="36" rx="10" fill="#f1f5f9"/>
  <text x="478" y="219" fill="#0f172a" font-size="13">Sigur! Pentru ce dată?</text>

  <rect x="526" y="246" width="210" height="36" rx="10" fill="#2563eb"/>
  <text x="538" y="269" fill="white" font-size="13">Weekendul 15-17 mai.</text>

  <rect x="466" y="296" width="240" height="36" rx="10" fill="#10b981"/>
  <text x="478" y="319" fill="white" font-size="13" font-weight="600">Perfect! Avem disponibil ✓</text>

  <!-- Green checkmark badge -->
  <circle cx="738" cy="54" r="20" fill="#10b981"/>
  <polyline points="727,54 735,62 750,46" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Label below -->
  <text x="610" y="385" text-anchor="middle" fill="#10b981" font-size="13" font-weight="600">Răspuns instant. Rezervare gata.</text>
</svg>
