<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- Fundal gradient albastru-violet -->
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg1)" rx="12"/>

  <!-- Titlu -->
  <text x="400" y="44" text-anchor="middle" fill="white" font-size="20" font-weight="600">Formular vs. Chatbot AI</text>

  <!-- ── STÂNGA: Formular ── -->
  <!-- Card formular -->
  <rect x="40" y="65" width="320" height="295" rx="12" fill="white" opacity="0.95"/>
  <!-- Header formular -->
  <rect x="40" y="65" width="320" height="44" rx="12" fill="#ef4444"/>
  <rect x="40" y="89" width="320" height="20" fill="#ef4444"/>
  <text x="200" y="92" text-anchor="middle" fill="white" font-size="14" font-weight="600">Formular de contact</text>

  <!-- Câmpuri formular -->
  <rect x="60" y="124" width="280" height="28" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="72" y="142" fill="#94a3b8" font-size="11">Nume *</text>
  <rect x="60" y="162" width="280" height="28" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="72" y="180" fill="#94a3b8" font-size="11">Prenume *</text>
  <rect x="60" y="200" width="280" height="28" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="72" y="218" fill="#94a3b8" font-size="11">Email *</text>
  <rect x="60" y="238" width="280" height="28" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="72" y="256" fill="#94a3b8" font-size="11">Telefon *</text>
  <rect x="60" y="276" width="280" height="44" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="72" y="302" fill="#94a3b8" font-size="11">Mesaj *</text>

  <!-- Buton trimite -->
  <rect x="60" y="332" width="280" height="16" rx="4" fill="#94a3b8"/>
  <text x="200" y="344" text-anchor="middle" fill="white" font-size="11">Completează. Trimite. Așteaptă.</text>

  <!-- Badge timp răspuns -->
  <rect x="100" y="358" width="200" height="24" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="200" y="374" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="600">⏳ Răspuns: 24-48 ore</text>

  <!-- ── DREAPTA: Chatbot ── -->
  <!-- Card chat -->
  <rect x="440" y="65" width="320" height="295" rx="12" fill="white" opacity="0.95"/>
  <!-- Header chat -->
  <rect x="440" y="65" width="320" height="44" rx="12" fill="#2563eb"/>
  <rect x="440" y="89" width="320" height="20" fill="#2563eb"/>
  <circle cx="462" cy="87" r="8" fill="white" opacity="0.3"/>
  <text x="600" y="92" text-anchor="middle" fill="white" font-size="14" font-weight="600">MyChatbot</text>

  <!-- Mesaje chat -->
  <!-- Bot -->
  <rect x="456" y="120" width="200" height="28" rx="14" fill="#f0f9ff"/>
  <text x="556" y="138" text-anchor="middle" fill="#0369a1" font-size="11">Bună! Cu ce vă pot ajuta?</text>
  <!-- User -->
  <rect x="524" y="158" width="216" height="28" rx="14" fill="#2563eb"/>
  <text x="632" y="176" text-anchor="middle" fill="white" font-size="11">Vreau să rezerv o cameră.</text>
  <!-- Bot -->
  <rect x="456" y="196" width="190" height="28" rx="14" fill="#f0f9ff"/>
  <text x="551" y="214" text-anchor="middle" fill="#0369a1" font-size="11">Pentru ce dată?</text>
  <!-- User -->
  <rect x="550" y="234" width="190" height="28" rx="14" fill="#2563eb"/>
  <text x="645" y="252" text-anchor="middle" fill="white" font-size="11">Weekend 15-17 mai.</text>
  <!-- Bot confirmare -->
  <rect x="456" y="272" width="244" height="28" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="578" y="290" text-anchor="middle" fill="#15803d" font-size="11">✓ Avem disponibil! 2 nopți.</text>

  <!-- Badge timp răspuns -->
  <rect x="480" y="358" width="240" height="24" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="600" y="374" text-anchor="middle" fill="#15803d" font-size="11" font-weight="600">⚡ Răspuns instant. Rezervare gata.</text>

  <!-- VS în mijloc -->
  <circle cx="400" cy="212" r="28" fill="white" opacity="0.15"/>
  <text x="400" y="219" text-anchor="middle" fill="white" font-size="20" font-weight="700">VS</text>
</svg>
