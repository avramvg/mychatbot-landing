<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="800" height="400" fill="#f0f9ff"/>

  <!-- Title -->
  <text x="400" y="44" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">Generare automată FAQ cu AI</text>

  <!-- Left bubble: Question -->
  <rect x="50" y="68" width="240" height="200" rx="20" fill="#2563eb"/>
  <!-- Bubble tail -->
  <polygon points="170,268 140,300 200,268" fill="#2563eb"/>
  <!-- ? symbol -->
  <text x="170" y="196" text-anchor="middle" fill="white" font-size="96" font-weight="700">?</text>
  <text x="170" y="330" text-anchor="middle" fill="#64748b" font-size="13">Întrebarea clientului</text>

  <!-- Arrow -->
  <line x1="316" y1="168" x2="484" y2="168" stroke="#0f172a" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="484,158 500,168 484,178" fill="#0f172a"/>
  <!-- AI label -->
  <rect x="352" y="146" width="96" height="26" rx="8" fill="#0f172a"/>
  <text x="400" y="163" text-anchor="middle" fill="white" font-size="12" font-weight="600">AI · automat</text>

  <!-- Right bubble: Answer -->
  <rect x="510" y="68" width="240" height="200" rx="20" fill="#10b981"/>
  <!-- Bubble tail -->
  <polygon points="630,268 600,300 660,268" fill="#10b981"/>
  <!-- ! symbol -->
  <text x="630" y="196" text-anchor="middle" fill="white" font-size="96" font-weight="700">!</text>
  <text x="630" y="330" text-anchor="middle" fill="#10b981" font-size="13" font-weight="600">Răspuns generat</text>

  <!-- FAQ list items at bottom -->
  <rect x="60" y="348" width="20" height="20" rx="4" fill="#2563eb"/>
  <rect x="88" y="354" width="140" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="240" y="354" width="80" height="8" rx="4" fill="#e2e8f0"/>

  <rect x="360" y="348" width="20" height="20" rx="4" fill="#2563eb"/>
  <rect x="388" y="354" width="120" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="520" y="354" width="100" height="8" rx="4" fill="#e2e8f0"/>

  <rect x="640" y="348" width="20" height="20" rx="4" fill="#2563eb"/>
  <rect x="668" y="354" width="90" height="8" rx="4" fill="#e2e8f0"/>
</svg>
