<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <linearGradient id="bgc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#92400e"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgc)" rx="12"/>

  <text x="400" y="44" text-anchor="middle" fill="white" font-size="20" font-weight="600">Chatbot de 5 stele</text>

  <!-- Stânga: Chatbot generic -->
  <rect x="40" y="65" width="320" height="295" rx="12" fill="white" opacity="0.95"/>
  <rect x="40" y="65" width="320" height="40" rx="12" fill="#94a3b8"/>
  <rect x="40" y="89" width="320" height="16" fill="#94a3b8"/>
  <text x="200" y="89" text-anchor="middle" fill="white" font-size="13" font-weight="600">Chatbot generic</text>

  <rect x="56" y="120" width="180" height="28" rx="14" fill="#f1f5f9"/>
  <text x="146" y="138" text-anchor="middle" fill="#475569" font-size="11">Check-in la ora 14:00.</text>

  <rect x="56" y="160" width="200" height="28" rx="14" fill="#f1f5f9"/>
  <text x="156" y="178" text-anchor="middle" fill="#475569" font-size="11">Nu dețin această informație.</text>

  <rect x="56" y="200" width="220" height="28" rx="14" fill="#f1f5f9"/>
  <text x="166" y="218" text-anchor="middle" fill="#475569" font-size="11">Da, avem camere disponibile.</text>

  <rect x="56" y="240" width="190" height="28" rx="14" fill="#f1f5f9"/>
  <text x="151" y="258" text-anchor="middle" fill="#475569" font-size="11">Vă vom contacta în curând.</text>

  <rect x="80" y="330" width="200" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="180" y="346" text-anchor="middle" fill="#94a3b8" font-size="11">Răspuns corect. Fără experiență.</text>

  <!-- Dreapta: Chatbot concierge -->
  <rect x="440" y="65" width="320" height="295" rx="12" fill="white" opacity="0.95"/>
  <rect x="440" y="65" width="320" height="40" rx="12" fill="#d97706"/>
  <rect x="440" y="89" width="320" height="16" fill="#d97706"/>
  <text x="600" y="89" text-anchor="middle" fill="white" font-size="13" font-weight="600">MyChatbot — concierge 5 stele</text>

  <rect x="456" y="116" width="288" height="40" rx="14" fill="#f0f9ff"/>
  <text x="600" y="131" text-anchor="middle" fill="#0369a1" font-size="10">Check-in la 14:00. Ajungeți mai devreme?</text>
  <text x="600" y="147" text-anchor="middle" fill="#0369a1" font-size="10">Depozităm bagajele gratuit!</text>

  <rect x="456" y="164" width="288" height="40" rx="14" fill="#f0f9ff"/>
  <text x="600" y="179" text-anchor="middle" fill="#0369a1" font-size="10">Nu am detaliile, dar echipa noastră</text>
  <text x="600" y="195" text-anchor="middle" fill="#0369a1" font-size="10">vă răspunde imediat. Vă conectez?</text>

  <rect x="456" y="212" width="288" height="40" rx="14" fill="#f0f9ff"/>
  <text x="600" y="227" text-anchor="middle" fill="#0369a1" font-size="10">Avem disponibilitate! Câte persoane?</text>
  <text x="600" y="243" text-anchor="middle" fill="#0369a1" font-size="10">Camera cu vedere la grădină e preferata.</text>

  <rect x="456" y="260" width="288" height="40" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="600" y="275" text-anchor="middle" fill="#15803d" font-size="10">Ce ocazie specială! Putem pregăti</text>
  <text x="600" y="291" text-anchor="middle" fill="#15803d" font-size="10">o surpriză pentru aniversare. Doriți?</text>

  <rect x="480" y="330" width="240" height="24" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="600" y="346" text-anchor="middle" fill="#15803d" font-size="11" font-weight="600">&#x2713; Răspuns + experiență + conversie</text>

  <!-- VS -->
  <circle cx="400" cy="212" r="24" fill="white" opacity="0.15"/>
  <text x="400" y="219" text-anchor="middle" fill="white" font-size="18" font-weight="700">VS</text>
</svg>
