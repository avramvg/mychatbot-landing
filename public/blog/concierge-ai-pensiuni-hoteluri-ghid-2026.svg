<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glow orb (decorative) -->
  <circle cx="950" cy="180" r="250" fill="url(#glow)"/>

  <!-- Tag pill: GHID 2026 -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="170" height="38" rx="19"
          fill="rgba(6, 182, 212, 0.15)"
          stroke="rgba(6, 182, 212, 0.4)"
          stroke-width="1"/>
    <text x="20" y="25"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="13"
          font-weight="700"
          fill="#06b6d4"
          letter-spacing="2px">GHID HoReCa · 2026</text>
  </g>

  <!-- Main title -->
  <text x="80" y="240"
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif"
        font-size="68"
        font-weight="800"
        fill="#ffffff"
        letter-spacing="-1px">Concierge AI</text>

  <text x="80" y="320"
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif"
        font-size="42"
        font-weight="500"
        fill="rgba(255, 255, 255, 0.85)">pentru pensiuni și hoteluri</text>

  <!-- Subtitle / description -->
  <text x="80" y="400"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="22"
        font-weight="400"
        fill="rgba(255, 255, 255, 0.6)">Ghidul complet: ce este, cum funcționează, cât costă</text>

  <text x="80" y="432"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="22"
        font-weight="400"
        fill="rgba(255, 255, 255, 0.6)">și cum îl implementezi în 5 minute</text>

  <!-- Decorative accent line -->
  <rect x="80" y="475" width="80" height="4" fill="url(#accent-gradient)" rx="2"/>

  <!-- Brand at bottom -->
  <g transform="translate(80, 530)">
    <text x="0" y="0"
          font-family="'Pacifico', cursive, system-ui"
          font-size="32"
          font-weight="400"
          fill="#F5A623">my</text>
    <text x="55" y="0"
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif"
          font-size="28"
          font-weight="800"
          fill="#ffffff"
          letter-spacing="2px">CHATBOT</text>
    <text x="245" y="-2"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="13"
          font-weight="400"
          fill="rgba(255, 255, 255, 0.5)"
          letter-spacing="0.5px">by Hello Web</text>
  </g>

  <!-- Decorative chat bubble icon (right side) -->
  <g transform="translate(900, 350)" opacity="0.9">
    <!-- Larger bubble -->
    <rect x="0" y="0" width="180" height="100" rx="20"
          fill="rgba(6, 182, 212, 0.12)"
          stroke="rgba(6, 182, 212, 0.3)"
          stroke-width="1.5"/>
    <circle cx="30" cy="50" r="5" fill="#06b6d4"/>
    <circle cx="50" cy="50" r="5" fill="#06b6d4" opacity="0.7"/>
    <circle cx="70" cy="50" r="5" fill="#06b6d4" opacity="0.4"/>

    <!-- Smaller bubble (response) -->
    <rect x="40" y="115" width="140" height="60" rx="15"
          fill="rgba(255, 255, 255, 0.06)"
          stroke="rgba(255, 255, 255, 0.15)"
          stroke-width="1"/>
    <circle cx="65" cy="145" r="4" fill="rgba(255, 255, 255, 0.5)"/>
    <circle cx="80" cy="145" r="4" fill="rgba(255, 255, 255, 0.4)"/>
    <circle cx="95" cy="145" r="4" fill="rgba(255, 255, 255, 0.3)"/>
  </g>
</svg>
