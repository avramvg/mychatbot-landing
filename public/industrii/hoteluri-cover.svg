    <rect x="55" y="85" width="20" height="25" rx="2" fill="rgba(255,255,255,0.25)"/>
    <rect x="90" y="85" width="20" height="25" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="125" y="85" width="20" height="25" rx="2" fill="rgba(255,255,255,0.25)"/>
    <rect x="160" y="85" width="20" height="25" rx="2" fill="rgba(255,255,255,0.15)"/>

    <rect x="20" y="120" width="20" height="25" rx="2" fill="rgba(255,255,255,0.25)"/>
    <rect x="55" y="120" width="20" height="25" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="90" y="120" width="20" height="25" rx="2" fill="rgba(255,255,255,0.25)"/>
    <rect x="125" y="120" width="20" height="25" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="160" y="120" width="20" height="25" rx="2" fill="rgba(255,255,255,0.25)"/>

    <rect x="80" y="170" width="40" height="50" rx="4"
