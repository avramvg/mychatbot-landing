    <text x="20" y="25"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="13"
          font-weight="700"
          fill="#06b6d4"
          letter-spacing="2px">VERTICALA · HOTELURI</text>
  </g>

  <text x="80" y="240"
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif"
